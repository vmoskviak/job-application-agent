<!doctype html>
<html lang="en">
<head><title>Contract Co - Apply</title></head>
<body>
  <form id="application">
    <label for="email">Email</label>
    <input id="email" name="email" aria-invalid="true" aria-describedby="email-error">
    <div id="email-error" class="error-message" role="alert">Please enter a valid email address.</div>
    <label for="phone">Phone</label>
    <input id="phone" name="phone" aria-invalid="true">
    <div class="error">This field is required.</div>
    <button type="submit">Submit application</button>
  </form>
</body>
</html>

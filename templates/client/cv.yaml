# CV data. One CV variant per group of similar roles: different order and content
# of bullets and skills over the same biography. One variant is enough to start.
variants: [standard]
default_variant: standard
experience: []
# - dates: 03.2021 – 12.2025
#   company: Firma GmbH, Stadt
#   title: Position
#   note: ''                       # e.g. 'Zeugnis: sehr gut'
#   bullets:                       # list, or a map variant -> list
#     standard:
#     - What she did, with a number or a result
#     default:
#     - Neutral wording for variants without their own bullets
education: []
# - dates: 2013 – 2017
#   inst: Hochschule
#   deg: Abschluss, Fach
#   note: ''
#   variants: [agile]            # optional: entry appears only in these CV variants
# Separate section "Weiterbildung & Zertifikate" (ATS looks for certificates there);
# fields as in education, empty list = no section.
certificates: []
ehrenamt:
  variants: []                     # which CV variants show it
  entries: []
skills:
  standard: []
# - [Row heading, Value · Value · Value]
# Attachments for the email application (files in attachments/). variants: only for
# these CV variants; portal: true: the file also goes into portal forms.
attachments: []
# - file: 01_Zeugnis_Firma_2025.pdf
#   label: Arbeitszeugnis Firma GmbH (2025)
#   portal: true

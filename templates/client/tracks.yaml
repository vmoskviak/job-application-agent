# Search tracks. A job gets a track by keywords in its title and description.
#   keywords  words/stems for scoring
#   variant   which CV variant (cv.yaml -> variants) goes to this track
#   priority  lower = more important (submission order within one run)
#   salary    salary expectation for the track, if it differs from default_salary
#   excluded  true: never apply on this track, but it is needed to filter out
#   cv_file   contract market: CV file in attachments/ that goes as the attachment for this track
#   letter    Anschreiben blocks (anlass/fit/transfer/salary_hint) for tailoring;
#             [FIRMA] and [JOBTITEL] are substituted
default_priority: 7
tracks: {}

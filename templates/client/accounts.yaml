# Mail accounts and browser profile. Tokens are NOT stored here: only the
# names of the directories under ~/.gmail-mcp and ~/.playwright-mcp on the run machine.
#
# Standard layout: two mailboxes:
#   jobs  a separate address for the search: applications go out from it,
#         portal job alerts arrive there; the agent may delete processed alerts
#   main  the personal address from the CV: employers reply here; the agent only
#         reads and replies in the same thread.
#         NOT required: if the personal mailbox is not on Gmail (GMX, Outlook),
#         remove the main block entirely and set profile.yaml -> email to the
#         jobs address. Employers then reply to jobs, the engine handles that.
gmail:
  jobs:
    address: ''
    creds_dir: __SLUG__-jobs
    role: Sending applications, job alerts
    may_delete: true
  main:
    address: ''
    creds_dir: __SLUG__-main
    role: Reading + replying to employers in thread
    may_delete: false
    rescue_trash: false          # true if the owner deletes replies herself
send_from: jobs
# Extra domains or addresses employers reply from, if they appear neither in
# the tracker nor in application packages (board submissions, replies from a group domain).
# employer_scan searches them together with the ATS domains.
employer_senders: []
# - beispiel-gruppe.de
playwright_profile: __SLUG__
# Portal credentials for auto-login (XING does not keep a session between runs).
# File lives only on the run machine, chmod 600, never in git:
#   {"xing": {"username": "...", "password": "..."}}
# portal_credentials: /root/.__SLUG__-portal-credentials.json
# Operator Telegram. The token lives only in the server environment (variable name here).
#   mode: cards  - the client's own bot with buttons (contract market, phase 2a)
#   mode: notify - the operator's shared bot, notifications about interviews and
#                  requests only; the morning agent keeps the tracker; do not enable
#                  the bot service for the client
# telegram:
#   token_env: JOBSEARCH_TELEGRAM_TOKEN_OPERATOR
#   chat_id: 0
#   mode: notify
#   lang: uk

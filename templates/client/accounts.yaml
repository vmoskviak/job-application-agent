# Поштові акаунти й браузерний профіль. Токени тут НЕ лежать: лише назви
# каталогів у ~/.gmail-mcp і ~/.playwright-mcp на машині запуску.
#
# Стандартна схема — дві скриньки:
#   jobs  окрема адреса під пошук: з неї йдуть заявки, на неї приходять
#         job-алерти порталів; агент може видаляти оброблені алерти
#   main  особиста адреса з CV: сюди відповідають роботодавці; агент лише
#         читає й відповідає в тому ж треді.
#         НЕ обов'язковий: якщо особиста скринька не на Gmail (GMX, Outlook),
#         блок main прибрати цілком, у profile.yaml → email поставити адресу
#         jobs. Роботодавці тоді відповідають на jobs, рушій це вміє.
gmail:
  jobs:
    address: ''
    creds_dir: __SLUG__-jobs
    role: Відправка заявок, job-alerts
    may_delete: true
  main:
    address: ''
    creds_dir: __SLUG__-main
    role: Читання + відповіді роботодавцям у thread
    may_delete: false
    rescue_trash: false          # true, якщо власниця сама видаляє відповіді
send_from: jobs
# Додаткові домени чи адреси, з яких відповідають роботодавці, якщо їх нема ні
# в трекері, ні в пакетах заявок (подача через дошку, відповідь з домену групи).
# employer_scan шукає їх разом із доменами ATS.
employer_senders: []
# - beispiel-gruppe.de
playwright_profile: __SLUG__
# Облікові дані порталів для автологіну (XING не тримає сесію між запусками).
# Файл лише на машині запуску, chmod 600, у git не потрапляє:
#   {"xing": {"username": "...", "password": "..."}}
# portal_credentials: /root/.__SLUG__-portal-credentials.json
# Telegram оператора. Токен лише в оточенні сервера (ім'я змінної тут).
#   mode: cards  — власний бот клієнта з кнопками (контрактний ринок, етап 2a)
#   mode: notify — спільний бот оператора, лише сповіщення про співбесіди й запити,
#                  трекер веде ранковий агент; сервіс бота для клієнта не вмикати
# telegram:
#   token_env: JOBSEARCH_TELEGRAM_TOKEN_OPERATOR
#   chat_id: 0
#   mode: notify
#   lang: uk

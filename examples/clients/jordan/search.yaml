# Contract search: what and where to search. {year} is replaced with the current year.
focus: >
  Remote B2B contracts: Android/Kotlin and AI agents.
do_not_search: >
  Junior, iOS-only, permanent positions.
query_groups:
- name: Android contract
  queries:
  - '"Android" "contract" remote Kotlin {year}'
- name: AI contract
  queries:
  - '"LLM" OR "AI agent" contract remote {year}'
career_pages_keywords: Android / Kotlin / LLM
career_pages: []
extra_sources: ''
# Contract market sources: the evening prompt enables steps by enabled.
sources:
  hn_whoishiring: {enabled: true}
  freelancermap_alerts: {enabled: true, channel: email, sender: freelancermap.de}   # alert sender in Gmail

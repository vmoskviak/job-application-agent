# Фільтри контрактного клієнта: B2B, remote, без ролей лише для штатних і без US work auth.
min_score: 25
max_submissions_per_run: 0       # авто-подачі нема: лише дайджест і чернетки
cleanup_min_tracker_rows: 0
excluded_title_patterns:
- '\bjunior\b'
- '\bintern(?:ship)?\b'
- '\bwerkstudent'
- '\bhead\s+of\b'
- '\bvp\b'
- '\bforward[\s-]*deployed\b'
- '^(?!.*android).*\bios\b'
description_bonus:
- {pattern: '\b(?:contract(?:or)?|freelanc\w*|b2b|freiberuf\w*|1099)\b', points: 20}
- {pattern: '\b(?:fully\s+remote|100\s*%\s*remote|remote[\s-]first)\b', points: 15}
- {pattern: '\b(?:CET|CEST|European\s+time\s*zones?|EU\s+time\s*zones?)\b', points: 10}
excluded_description_patterns:
- reason: employee_only
  pattern: '\b(?:permanent\s+(?:position|role)|full[\s-]?time\s+employee|festanstellung|unbefristet\w*|W-?2\s+only|employees?\s+only)\b'
  unless: '\b(?:contract(?:or)?|freelanc\w*|b2b|freiberuf\w*|1099|C2C|corp[\s-]to[\s-]corp)\b'
- reason: onsite_only
  pattern: '\b(?:on[\s-]?site\s+only|onsite\s+only|no\s+remote|ausschließlich\s+vor\s+ort|kein(?:e)?\s+remote)\b'
  unless: '\bremote\b'
agencies_de: [hays.de, solcom.de, gulp.de, westhouse.de, etengo.de]
email_dead_companies: []
region_label: Portugal (remote)
remote_policy: any
locations: [lisbon, portugal]
# Етап 2a: follow-up поштою через N днів після подачі без відповіді
followup_days: 7
# Етап 2a: назви, яких чернетки для агентур і платформ не називають (поточний роботодавець)
forbidden_names: [Example Corp]
# Етап 2b: що додати німецьким агентурам поверх CV (attachments/)
agency_attachments: [Project_List_DE.pdf]
# Етап 2b: подачі без тапу (спека §2.2) і денні ліміти на канал (§6)
send_policy: auto
daily_limits: {email: 5, form: 5}
